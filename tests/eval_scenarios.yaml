scenarios:
  - id: S01
    query: "의료급여 수급자인데 암 진단을 받았어요. 의료비 지원 받을 수 있나요?"
    expected_policies: ["암의료비지원", "산정특례"]
    also_acceptable: []

  - id: S02
    query: "희귀질환 진단받은 아이가 있는데 의료비 지원 받을 수 있나요?"
    expected_policies: ["희귀질환의료비지원", "산정특례"]
    also_acceptable: []

  - id: S03
    query: "국가암검진 통보서를 받았는데 어느 병원에서 검진받으면 되나요?"
    expected_policies: ["국가암검진"]
    also_acceptable: []

  - id: S04
    query: "아이가 백혈병 진단을 받았어요. 치료비 지원이 있나요?"
    expected_policies: ["암의료비지원"]
    also_acceptable: ["산정특례"]

  - id: S05
    query: "건강보험 가입자인데 위암 진단받았어요. 보건소에서 지원받을 수 있나요?"
    expected_policies: ["암의료비지원"]
    note: "applicable=false 케이스 — 건강보험 가입자 신규지원 중단(2021.7.1) 안내 확인용"
