scenarios:
  # 성인암 — 의료급여 수급자
  - id: C01
    description: 성인암 의료급여 수급자 → 암종 확인 후 내방 안내
    initial_query: "의료급여 수급자인데 위암 진단을 받았어요."
    citizen_profile: |
      당신은 의료급여 수급자이며 2개월 전 위암 진단을 받은 58세 시민입니다.
      상담사의 질문에 아래 사실만 바탕으로 짧고 자연스럽게 한국어로 답하세요.
      - 보험 유형: 의료급여 수급자
      - 암종: 위암
      - 나이: 58세 성인
      절대 스스로 질문하지 마세요. 상담사가 물어보는 것에만 답하세요.
    expected_termination: 방문안내
    expected_checklist:
      - policy: 성인암의료비지원
        label: "보험 유형 확인 (의료급여·차상위 / 건강보험)"
        met: true
      - policy: 성인암의료비지원
        label: "진단 암종이 지원 범위에 해당 (위·대장·간·유방·자궁경부암·폐암)"
        met: true
    # 의료급여 수급자 → 수검일·진단일·보험료 항목 스킵 (counselor.py 특칙)

  # 성인암 — 건보, 수검일 조건 미충족
  - id: C02
    description: 성인암 건보 수검일 미충족 → 지원불가 + 대안 안내
    initial_query: "건강보험 가입자인데 위암 진단받았어요."
    citizen_profile: |
      당신은 건강보험 가입자이며 2025년 1월 위암 진단을 받은 60세 시민입니다.
      상담사의 질문에 아래 사실만 바탕으로 짧고 자연스럽게 한국어로 답하세요.
      - 보험 유형: 건강보험
      - 암종: 위암
      - 국가암검진 수검일: 2023년 (2021.6.30 이후)
      - 암 진단일: 2025년 1월
      절대 스스로 질문하지 마세요. 상담사가 물어보는 것에만 답하세요.
    expected_termination: 지원불가안내
    expected_checklist:
      - policy: 성인암의료비지원
        label: "보험 유형 확인 (의료급여·차상위 / 건강보험)"
        met: false
    # 수검일 met=false는 종료 직전 턴에서 LLM이 업데이트 누락 — termination으로 검증

  # 성인암 — 건보, 수검일·진단일 모두 충족 (삼분법 핵심 케이스)
  - id: C03
    description: 성인암 건보 조건 충족 → 보험료 확인 위해 내방 안내
    initial_query: "건강보험 가입자인데 위암 진단을 받았어요. 보건소에서 지원을 받을 수 있나요?"
    citizen_profile: |
      당신은 건강보험 가입자이며 위암 진단을 받은 55세 시민입니다.
      상담사의 질문에 아래 사실만 바탕으로 짧고 자연스럽게 한국어로 답하세요.
      - 보험 유형: 건강보험
      - 국가암검진 수검일: 2020년 5월 (2021.6.30 이전)
      - 암 진단일: 2022년 3월 (2023.6.30 이전)
      - 암종: 위암
      절대 스스로 질문하지 마세요. 상담사가 물어보는 것에만 답하세요.
    expected_termination: 방문안내
    min_turns: 2  # 삼분법 흐름 확인: 수검일·진단일을 물어보는 과정이 있어야 함
    expected_checklist:
      - policy: 성인암의료비지원
        label: "건강보험료 기준 충족 (건강보험 가입자만 — 직장 127,500원 이하 / 지역 60,000원 이하)"
        met: null  # visit 항목 — 가드레일로 항상 null
    # 수검일·진단일 met 업데이트는 LLM 불일치로 미검증; min_turns으로 흐름 보장

  # 소아암 — 의료급여 당연선정
  - id: C04
    description: 소아암 의료급여 수급자 → 당연선정, 소득 확인 없이 내방 안내
    initial_query: "의료급여 수급자인데 10살 아이가 백혈병 진단을 받았어요."
    citizen_profile: |
      당신은 의료급여 수급자이며 10살 아이가 백혈병 진단을 받은 보호자입니다.
      상담사의 질문에 아래 사실만 바탕으로 짧고 자연스럽게 한국어로 답하세요.
      - 보험 유형: 의료급여 수급자
      - 아이 나이: 10세
      - 암종: 백혈병
      절대 스스로 질문하지 마세요. 상담사가 물어보는 것에만 답하세요.
    expected_termination: 방문안내
    expected_checklist:
      - policy: 소아암의료비지원
        label: "소득·재산 기준 충족 (건강보험 가입자만 해당 — 의료급여 수급자는 당연 선정)"
        met: null  # visit 항목 — 의료급여 당연선정이어도 전화로 판정 불가
    # 나이 확인은 초기 발화에서 확인되나 LLM 체크리스트 업데이트 불일치로 미검증

  # 희귀질환 — 파브리병
  - id: C05
    description: 희귀질환 파브리병 → KCD 코드 확인 후 소득 기준 내방 안내
    initial_query: "파브리병 진단을 받았어요. 의료비 지원이 있나요?"
    citizen_profile: |
      당신은 파브리병(Fabry disease) 진단을 받은 40세 건강보험 가입자입니다.
      상담사의 질문에 아래 사실만 바탕으로 짧고 자연스럽게 한국어로 답하세요.
      - 보험 유형: 건강보험
      - 진단명: 파브리병
      - 나이: 40세
      절대 스스로 질문하지 마세요. 상담사가 물어보는 것에만 답하세요.
    expected_termination: 방문안내
    expected_checklist:
      - policy: 희귀질환의료비지원
        label: "희귀질환 코드(KCD) 해당 여부 확인"
        met: true
      - policy: 희귀질환의료비지원
        label: "소득 기준 충족 여부 확인"
        met: null  # visit 항목

  # 희귀질환 — 정보를 나눠서 제공 (턴 간 상태 유지 관찰)
  # 주의: 이 시나리오는 "확정값 보호 가드레일이 되돌림을 막았다"를 증명하지 않는다.
  #       가드레일은 LLM이 실제로 되돌리려 시도할 때만 발동하므로, 통과해도
  #       "LLM이 애초에 건드리지 않았다"와 구분되지 않는다.
  #       가드레일 자체의 결정적 검증은 tests/test_guardrails.py에 있다.
  #       여기서 보는 것은 실제 멀티턴 대화에서 상태가 실제로 흔들리지 않는지다.
  - id: C06
    description: 희귀질환 병명을 2턴째에 밝힘 → 중간에 확정된 KCD 항목이 종료까지 유지되는지
    initial_query: "희귀질환 진단을 받았는데 의료비 지원이 있나요?"
    citizen_profile: |
      당신은 파브리병(Fabry disease) 진단을 받은 40세 건강보험 가입자입니다.
      상담사의 질문에 아래 사실만 바탕으로 짧고 자연스럽게 한국어로 답하세요.
      - 진단명: 파브리병
      - 보험 유형: 건강보험
      - 나이: 40세
      묻지 않은 정보는 먼저 말하지 마세요. 상담사가 물어본 것에만 답하세요.
      절대 스스로 질문하지 마세요.
    expected_termination: 방문안내
    min_turns: 2  # 병명 확인 턴 + 이후 턴이 있어야 '유지' 관찰이 성립
    expected_checklist:
      - policy: 희귀질환의료비지원
        label: "희귀질환 코드(KCD) 해당 여부 확인"
        met: true  # 2턴째에 확정된 값이 종료 시점까지 남아있어야 함
      - policy: 희귀질환의료비지원
        label: "소득 기준 충족 여부 확인"
        met: null  # visit 항목
